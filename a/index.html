<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Registro arnie · Vie del Lago</title>
<script>
  // Pagina di rimando per i tag NFC e i QR delle arnie: /a/#A01 apre la scheda A01 del registro.
  // Così le etichette restano valide anche se l'app cambia indirizzo: basta aggiornare questa pagina.
  (function () {
    var base = "https://registro-regine.pages.dev/";
    var code = (location.hash || "").slice(1);
    if (!code) { try { code = new URLSearchParams(location.search).get("a") || ""; } catch (e) {} }
    code = code.replace(/[^A-Za-z0-9-]/g, "").slice(0, 20);
    window.__dest = base + (code ? "#" + code : "");
    location.replace(window.__dest);
  })();
</script>
<style>
  body { font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f6f2e9; color: #2a2418; margin: 0; padding: 40px 24px; text-align: center; }
  a { color: #9c6a0c; font-weight: 600; }
</style>
</head>
<body>
<p>Apro il registro delle arnie…</p>
<p><a id="vai" href="https://registro-regine.pages.dev/">Se non si apre, tocca qui</a></p>
<script>
  if (window.__dest) document.getElementById("vai").href = window.__dest;
</script>
</body>
</html>
